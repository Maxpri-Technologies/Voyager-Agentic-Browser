<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Voyager Agent</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div class="user-profile">
            <img id="userAvatar" src="" alt="User Avatar" style="display: none;">
            <span id="userName">Not signed in</span>
        </div>
        <div class="header-controls">
            <button id="authButton">Sign In</button>
        </div>
    </div>

    <div id="chatContainer"></div>

    <div id="agent-state-container" style="display: none;">
        <div class="status-bar">
            <span id="agent-status-text">Initializing...</span>
            <button id="stop-btn" class="stop-button">Stop Agent</button>
        </div>
    </div>

    <div id="idle-state-container">
        <textarea id="objectiveInput" placeholder="Ask the agent to do something..." rows="1"></textarea>
        <button id="micButton" class="icon-btn">🎙️</button>
        <button id="startButton">▶</button>
    </div>

    <details class="logs-details">
        <summary>
            <div class="status-indicator"></div>
            <span id="logs-status-text">Agent Logs</span>
        </summary>
        <div id="log-panel"></div>
    </details>

    <script src="popup.js"></script>
</body>
</html>
